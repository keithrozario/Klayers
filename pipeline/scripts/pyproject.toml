[project]
name = "klayers-pipeline-scripts"
version = "0.1.0"
description = "Validation and utility scripts for Klayers pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "packaging>=24.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
