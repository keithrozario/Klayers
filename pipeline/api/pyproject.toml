[project]
name = "klayers-api"
version = "0.1.0"
description = "CDK Mini-App for Klayers API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aws-cdk-lib>=2.170.0",
    "constructs>=10.0.0",
]

[dependency-groups]
dev = [
    "aws-lambda-powertools>=3.0.0",
    "boto3>=1.34.0",
    "moto[dynamodb]>=5.0.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "tabulate>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
