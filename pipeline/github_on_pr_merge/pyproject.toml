[project]
name = "klayers-gh-push"
version = "0.1.0"
description = "CDK Mini-App for Klayers GitHub on PR merge pipeline"
readme = "README.MD"
requires-python = ">=3.13"
dependencies = [
    "aws-cdk-lib>=2.170.0",
    "constructs>=10.0.0",
]

[dependency-groups]
dev = [
    "aws-lambda-powertools>=3.0.0",
    "aws-requests-auth>=0.4.3",
    "boto3>=1.35.0",
    "moto[dynamodb,events,s3,ssm]>=5.0.0",
    "pytest>=8.0.0",
    "requests>=2.32.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
