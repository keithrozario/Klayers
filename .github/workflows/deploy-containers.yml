              uv sync --frozen || uv sync
            fi
            npx --yes aws-cdk@2 deploy --all --require-approval never -c stage=${{ vars.AWS_STAGE }}
          fi

  promote-prod:
    name: Promote to Prod
    needs: [generate-matrix, build-images, promote-dev]
    if: |
      always() &&
      needs.build-images.result == 'success' &&
      (
        inputs.target_environment == 'prod' ||
        ((github.event_name == 'push' || inputs.target_environment == 'promote_all') && needs.promote-dev.result == 'success')
      )
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download container artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: container-*
          path: /tmp/containers
          merge-multiple: true

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-duration-seconds: 1800
          role-session-name: deploy-containers-${{ vars.AWS_STAGE }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure skopeo is installed
        run: |
          if ! command -v skopeo >/dev/null 2>&1; then
