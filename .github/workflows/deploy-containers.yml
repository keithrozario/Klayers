            REPO_PARAM="/kl/${AWS_STAGE}/${PARAM_PREFIX}/repo"
            echo "Fetching repository URL from SSM: $REPO_PARAM"
            REPO_URL=$(aws ssm get-parameter --name "$REPO_PARAM" --query 'Parameter.Value' --output text)
            REPO_NAME="${REPO_URL#*/}"

            echo "Copying OCI archive ($arch) to ${REPO_URL}:latest and ${REPO_URL}:${GITHUB_SHA}..."
            skopeo copy "oci-archive:${TAR_FILE}" "docker://${REPO_URL}:latest"
            skopeo copy "oci-archive:${TAR_FILE}" "docker://${REPO_URL}:${GITHUB_SHA}"

            echo "Fetching image digest for latest..."
            DIGEST=$(aws ecr describe-images --repository-name "$REPO_NAME" --image-ids imageTag=latest --query 'imageDetails[0].imageDigest' --output text)
            echo "Writing digest ($DIGEST) to SSM: /kl/${AWS_STAGE}/${PARAM_PREFIX}/digest"
            aws ssm put-parameter --name "/kl/${AWS_STAGE}/${PARAM_PREFIX}/digest" --value "$DIGEST" --overwrite --type String
          done

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Roll forward CDK infra if present
        run: |
          if [ -f pipeline/core_pipeline/infra.py ]; then
            cd pipeline/core_pipeline
