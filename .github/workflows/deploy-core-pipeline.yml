name: Deploy Core Pipeline

on:
  push:
    branches:
      - master
    paths:
      - "pipeline/core_pipeline/**"
      - "pipeline/config/config.json"
      - ".github/workflows/deploy-core-pipeline.yml"
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment to deploy"
        type: choice
        options:
          - default
          - dev
          - prod
          - promote_all
        default: default

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_reusable-cdk-deploy.yml
    with:
      project_dir: pipeline/core_pipeline
      target_environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'promote_all' }}
