name: Deploy GitHub on PR Merge

on:
  push:
    branches:
      - master
    paths:
      - "pipeline/github_on_pr_merge/**"
      - ".github/workflows/deploy-pr-merge.yml"
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment to deploy to"
        type: choice
        options:
          - default
          - dev
          - prod
          - promote_all
        default: default

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_reusable-cdk-deploy.yml
    with:
      project_dir: pipeline/github_on_pr_merge
      target_environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'promote_all' }}
